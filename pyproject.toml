[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent"
version = "2.5.0"
description = "An evidence-driven terminal bridge for Claude Code and Codex CLI collaboration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MultiAgent contributors" }]
dependencies = []

[project.scripts]
multiagent = "multiagent_cli.cli:main"

[project.gui-scripts]
multiagent-web = "multiagent_cli.web_launcher:main"

[tool.setuptools.packages.find]
include = ["multiagent_cli*"]

[tool.setuptools.package-data]
multiagent_cli = ["web/*"]
